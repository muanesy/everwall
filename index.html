<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <title>万古防线 EVERWALL</title>
  <link rel="stylesheet" href="./src/styles.css" />

  -->

    {
      "imports": {
        "three": "./assets/vendor/three/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="game-container"></div>

  <!--
    这个文件只负责“把东西装起来”，一般不需要改。
    界面由 src/ui.js 生成，样式在 src/styles.css。
  -->
  <script type="module" src="./src/game.js"></script>
</body>
</html>
